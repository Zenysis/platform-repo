name: Build Pipeline Final Image
description: Builds and pushes the final pipeline Docker image for an integration

inputs:
  integration:
    description: Integration to build (e.g. default, mz, rw). Not required to build images that have their own repos.
    required: false
  image_tag:
    description: Docker image tag
    required: true
  aws_role:
    description: IAM role ARN to assume
    required: true
  main_repo_branch:
    description: Branch or Docker tag to use in the main repo for the shared base image
    required: false

runs:
  using: composite
  steps:
    - name: Git clone the repository
      uses: actions/checkout@v3

    - name: Extract branch name
      id: extract-branch
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/utils.sh"
        BRANCH_NAME=$(sanitize_branch_name "${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}")
        echo "sanitized_branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

    - name: Resolve main repo image tag
      id: resolve-main-repo-tag
      shell: bash
      env:
        DEFAULT_IMAGE_TAG: ${{ steps.extract-branch.outputs.sanitized_branch }}
        MAIN_REPO_BRANCH: ${{ inputs.main_repo_branch }}
      run: |
        source "$GITHUB_ACTION_PATH/utils.sh"

        TAG="$MAIN_REPO_BRANCH"
        if [ -n "$TAG" ]; then
          TAG=$(sanitize_branch_name "$TAG")
        else
          TAG="$DEFAULT_IMAGE_TAG"
        fi

        echo "main_repo_tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4.2.1
      with:
        role-to-assume: ${{ inputs.aws_role }}
        role-session-name: GitHub_AWS_via_FederatedOIDC
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build final image
      shell: bash
      env:
        INTEGRATION: ${{ inputs.integration }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        PIPELINE_COMMON_REPOSITORY: etl-pipeline-common
        IMAGE_TAG: ${{ steps.extract-branch.outputs.sanitized_branch }}
      run: |
        set -x
        set -a
        if [ -f pipeline.env ]; then
          source pipeline.env
          # Stage files into the directory layout the Dockerfile expects
          mkdir -p prod/roledefs scripts/cli_util/deployment_credentials
          cp roledef.py "prod/roledefs/${ROLEDEF_TARGET}.py"
          # Set inclusion vars for Dockerfile build args
          PIPELINE_INCLUSION=pipeline
          PIPELINE_TARGET="pipeline/$PIPELINE_TARGET"
          CONFIG_INCLUSION=config
          CONFIG_TARGET="config/$ZEN_ENV"
          ROLEDEF_INCLUSION="$ROLEDEF_TARGET"
          # Capture deployment repo metadata
          DEPLOYMENT_COMMIT_SHA=$(git rev-parse HEAD)
          DEPLOYMENT_REPO_URL=$(git remote get-url origin 2>/dev/null || echo "")
          DEPLOYMENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
        elif [ -n "$INTEGRATION" ]; then
          BUILD_ENV_FILE="docker/pipeline/build_env/${INTEGRATION}.env"
          if [ ! -f "$BUILD_ENV_FILE" ]; then
            echo "::error::Build environment file '$BUILD_ENV_FILE' not found."
            exit 1
          fi
          source "$BUILD_ENV_FILE"
          DEPLOYMENT_COMMIT_SHA=""
          DEPLOYMENT_REPO_URL=""
          DEPLOYMENT_BRANCH=""
        else
          echo "::warning::No pipeline.env found, so the action cannot infer deployment settings automatically."
          echo "::error::Set the optional 'integration' input when calling this action without a pipeline.env file."
          exit 1
        fi
        set +a

        docker buildx build \
          --tag "$REGISTRY/$PIPELINE_REPOSITORY:$IMAGE_TAG" \
          -f ${{ github.action_path }}/Dockerfile.final \
          --cache-from type=registry,ref="$REGISTRY/$PIPELINE_REPOSITORY:$IMAGE_TAG" \
          --cache-from type=registry,ref="$REGISTRY/$PIPELINE_REPOSITORY:master" \
          --build-arg BASE_IMAGE=$REGISTRY/$PIPELINE_COMMON_REPOSITORY \
          --build-arg TAG="${{ steps.resolve-main-repo-tag.outputs.main_repo_tag }}" \
          --build-arg PIPELINE_INCLUSION="$PIPELINE_INCLUSION" \
          --build-arg PIPELINE_TARGET="$PIPELINE_TARGET" \
          --build-arg CONFIG_INCLUSION="$CONFIG_INCLUSION" \
          --build-arg CONFIG_TARGET="$CONFIG_TARGET" \
          --build-arg ROLEDEF_INCLUSION="$ROLEDEF_INCLUSION" \
          --build-arg DEPLOYMENT_REPO_URL="$DEPLOYMENT_REPO_URL" \
          --build-arg DEPLOYMENT_COMMIT_SHA="$DEPLOYMENT_COMMIT_SHA" \
          --build-arg DEPLOYMENT_BRANCH="$DEPLOYMENT_BRANCH" \
          --push \
          .
