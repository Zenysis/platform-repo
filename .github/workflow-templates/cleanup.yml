# Copy this file to .github/workflows/cleanup.yml in your deployment repo.
# Update the aws_role to match the IAM role created for your deployment.
#
# Do not add `shared_repositories` here. That input exists for the main
# platform repo, which owns the shared etl-pipeline-* and web-* images. A
# deployment repo passing it would delete images belonging to every other
# deployment.
name: AWS Docker Image Cleanup
on:
  # Delete associated images when a PR is closed.
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    uses: Zenysis/platform-repo/.github/workflows/ecr-cleanup.yml@main
    with:
      aws_role: arn:aws:iam::251860034030:role/TODO  # Replace with your IAM role ARN
